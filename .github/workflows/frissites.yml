name: Eredmények frissítése

on:
  schedule:
    - cron: '17 5,22 * * *'   # naponta 7:17 és 0:17 körül (magyar idő szerint, nyáron)
  workflow_dispatch:           # kézi indítás az Actions fülről

permissions:
  contents: write

jobs:
  frissites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Eredmények letöltése
        run: node scripts/frissites.mjs
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - name: Mentés a repóba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/friss.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Eredmények frissítése" && git push)
