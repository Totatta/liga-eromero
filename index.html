<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="theme-color" content="#17201b">
<meta name="apple-mobile-web-app-title" content="Erőmérő">
<meta name="mobile-web-app-capable" content="yes">
<title>Liga Erőmérő</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap">
<style>
/* Elrendezés: ragadós fejléc (ligák + fülek), alatta egyhasábos, max 780px széles tartalom, kártyák csak ott, ahol önálló egységről van szó */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --ink:#17201b; --muted:#5b6a62; --line:#d8dfda; --soft:#e8ede9;
  --att:#d9480f; --def:#1971c2; --accent:#2f7d43;
  --win:#2f9e44; --draw:#868e96; --loss:#c92a2a;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161f1a; --ink:#e4ebe6; --muted:#93a39a; --line:#28342d; --soft:#1d2822;
  --att:#ff8a4c; --def:#4dabf7; --accent:#5fcf7a; --win:#51cf66; --draw:#909aa1; --loss:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161f1a; --ink:#e4ebe6; --muted:#93a39a; --line:#28342d; --soft:#1d2822;
  --att:#ff8a4c; --def:#4dabf7; --accent:#5fcf7a; --win:#51cf66; --draw:#909aa1; --loss:#ff6b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 0;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-disp);font-weight:700;font-size:1.7rem;letter-spacing:.01em;margin:0;line-height:1}
h1 span{color:var(--accent)}
.stamp{font-size:.75rem;color:var(--muted);text-align:right;min-width:0;line-height:1.3}
.brand{flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 .9rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px 4px 9px;font:600 1.05rem var(--f-disp);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:18px 48px;display:grid;gap:22px}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.35rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.82rem}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums;font-weight:600}
.att{color:var(--att)} .def{color:var(--def)}
.sec{display:grid;gap:10px}
.note{font-size:.84rem;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px}
.note b{color:var(--ink)}
/* rangsor */
.tblwrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:600 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--soft)}
td.team{font-weight:600;max-width:9.5em;overflow:hidden;text-overflow:ellipsis}
td.rk{font:700 1.05rem var(--f-disp);color:var(--muted);width:1.8em}
.bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-left:4px}
.delta{font-size:.78rem;font-weight:600}
.up{color:var(--win)} .dn{color:var(--loss)} .eq{color:var(--muted)}
.zone-top td.rk{color:var(--accent)} .zone-rel td.rk{color:var(--loss)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted)}
/* csapat */
.teamhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
select{font:500 .95rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px}
.stat .v{font:700 1.7rem/1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.stat .s{font-size:.75rem;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px 4px}
.chart svg{display:block;width:100%;height:auto}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tier{border-top:3px solid var(--line);padding-top:8px;display:grid;gap:2px;min-width:0}
.tier .t{font:600 .95rem var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.wdl{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.wdl i{display:block;height:100%}
.matches{display:grid}
.m{display:grid;grid-template-columns:3.2em 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.m .d{font-size:.75rem;color:var(--muted);line-height:1.2}
.m .o{min-width:0}
.m .o b{font-weight:600}
.m .o .x{font-size:.76rem;color:var(--muted)}
.m .r{text-align:right}
.res{display:inline-block;min-width:3.1em;text-align:center;font:700 1.05rem var(--f-disp);border-radius:6px;padding:2px 6px;color:#fff}
.res.W{background:var(--win)} .res.D{background:var(--draw)} .res.L{background:var(--loss)}
.perf{font-size:.75rem;font-weight:600;display:block;margin-top:2px}
/* meccs */
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.pick select{width:100%}
.vs{font:700 1rem var(--f-disp);color:var(--muted)}
.prob{display:grid;gap:6px}
.pbar{display:flex;height:34px;border-radius:8px;overflow:hidden;font:700 1rem var(--f-disp);color:#fff}
.pbar div{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.plab{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.xg{display:flex;justify-content:space-between;align-items:baseline}
.xg .num{font-size:2rem}
.grid6{display:grid;grid-template-columns:2em repeat(6,minmax(0,1fr));gap:2px;font-variant-numeric:tabular-nums}
.grid6 div{text-align:center;font-size:.78rem;padding:7px 0;border-radius:3px}
.grid6 .h{color:var(--muted);font-weight:600;background:none}
.g6wrap{display:grid;grid-template-columns:18px minmax(0,1fr);grid-template-areas:". top" "side grid";gap:2px 4px}
.g6top{grid-area:top;padding-left:2em;text-align:center;font:600 .82rem var(--f-body);color:var(--away,#c92a2a)}
.g6top span,.g6side span{white-space:nowrap}
.g6side{grid-area:side;display:flex;align-items:center;justify-content:center;padding-top:28px}
.g6side span{writing-mode:vertical-rl;transform:rotate(180deg);font:600 .82rem var(--f-body);color:var(--win)}
.g6wrap .grid6{grid-area:grid}
.g6wrap{margin-bottom:6px}
.g6side{flex-direction:column;gap:3px}.g6ar{color:var(--win);font-size:.9rem;line-height:1}
.g6top{color:var(--loss)}
.fx{display:grid;grid-template-columns:minmax(0,1fr) 7.5em;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fx .tm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .mini{display:flex;height:10px;border-radius:5px;overflow:hidden}
.fx .pp{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.entry{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.entry input{width:2.6em;font:600 1rem var(--f-disp);text-align:center;padding:5px 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.btn{font:600 .85rem var(--f-body);border:1px solid var(--accent);color:var(--accent);background:none;border-radius:6px;padding:5px 10px;cursor:pointer}
.btn.solid{background:var(--accent);color:var(--bg)}
.tag{display:inline-block;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--muted);margin-left:6px}
.pct{font-variant-numeric:tabular-nums}
.clickable{cursor:pointer;border-radius:6px}
.clickable:hover{background:var(--soft)}
.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tday{font:700 1.05rem var(--f-disp);letter-spacing:.03em;padding:14px 0 4px;border-bottom:2px solid var(--ink)}
.tday .muted{font-weight:500}
.tip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.tip .tm{font-weight:600;min-width:0}
.tip .one{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip .one b{color:var(--ink);font-weight:600}
.tip .sc{grid-column:1/-1;font-size:.88rem;font-variant-numeric:tabular-nums}
.odds{color:var(--def);font-weight:600;font-variant-numeric:tabular-nums}
.tip .odds{font-size:.8rem}
.pp.odds{font-size:.72rem}
.odd{font:700 1.1rem var(--f-disp);color:var(--def);font-variant-numeric:tabular-nums}
.bk{grid-column:1/-1;font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.bko{font-variant-numeric:tabular-nums;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--soft)}
.bko.val{background:color-mix(in srgb,var(--win) 22%,transparent);color:var(--ink)}
.vl{grid-column:1/-1;font-size:.84rem;border-left:3px solid var(--win);padding:3px 0 3px 8px;display:grid;gap:2px}
.vctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vctl select{padding:5px 8px}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tgb{display:inline-flex;align-items:center;gap:7px;line-height:1.3;max-width:100%;font:500 .84rem var(--f-body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;cursor:pointer;text-align:left}
.tgb b{color:inherit;font-weight:700}
.tgb .sw{display:inline-flex;flex:0 0 auto}
.tgb[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:var(--soft)}
.tgb[aria-pressed="false"] svg{opacity:.35}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.fx .tm{font-size:1rem;font-weight:600;white-space:normal}
.fxs{font-size:.8rem;color:var(--muted)}
.fx{grid-template-columns:minmax(0,1fr) 9em}
.fx .pp{font-size:.8rem}.fx .pp.odds{font-size:.78rem}
.tctl{display:grid;gap:8px}
.flist{display:grid;gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-radius:6px}
.ftm{font:700 1.05rem/1.2 var(--f-body);color:var(--ink);min-width:0}
.fmeta{font-size:.78rem;color:var(--muted);white-space:nowrap}
.fg{display:grid;grid-template-columns:14px repeat(5,minmax(0,1fr));gap:4px}
.flab{display:flex;flex-direction:column;padding-top:22px}
.flab div{display:flex;align-items:center;justify-content:center;overflow:hidden}
.flab span{writing-mode:vertical-rl;transform:rotate(180deg);font:600 10px/1 var(--f-disp);letter-spacing:.02em;color:var(--muted);white-space:nowrap;opacity:.8}
.fc{background:var(--bg);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.fc.v{background:color-mix(in srgb,var(--win) 16%,var(--surface));box-shadow:inset 0 0 0 2px var(--win)}
.fc.out{opacity:.42}
.fk{height:22px;display:flex;align-items:center;justify-content:center;font:700 13px var(--f-disp);color:var(--muted);letter-spacing:.04em}
.fs{display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.fm{height:44px}
.fi{height:44px;border-top:1px solid var(--line)}
.fv{height:34px;border-top:1px solid var(--line);gap:1px}
.fb{font:700 22px/1 var(--f-disp);color:var(--ink)}
.fi .fb{color:var(--muted)}
.fp{font-size:10.5px;line-height:1.3;color:var(--muted)}
.fi .fp{opacity:.8}
.fval{font-weight:700;font-size:12px;line-height:1.1}
.fkl{font-size:10px;color:var(--muted);line-height:1.1}
.fval.pos{color:var(--win)}.fval.neg{color:var(--muted);opacity:.75}
.fsh{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fsg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.fsb{background:var(--bg);border-radius:8px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-variant-numeric:tabular-nums}
.fr{font:700 22px/1 var(--f-disp);color:var(--ink)}
.fx2{font-size:11px;color:var(--muted)}.fx2 b{color:var(--ink)}
details.note summary{cursor:pointer}
details.note p{margin-top:6px}
.tpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.trow{display:grid;grid-template-columns:5.9em minmax(0,1fr);gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.tlab{font:600 .66rem/1.25 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:9px}
.tbody{display:grid;gap:6px;min-width:0}
.tline{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tsub{font-size:.82rem;color:var(--muted)}.tsub.off{opacity:.45}
.trow.dis .tlab,.trow.dis .tline{opacity:.35;pointer-events:none}
.nsel{padding:5px 6px;font-size:.9rem;width:auto;min-width:0}
.nsel:disabled{opacity:.45}
.sw{position:relative;width:42px;height:24px;border-radius:12px;border:0;background:var(--line);cursor:pointer;flex:0 0 auto;padding:0}
.sw .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] .knob{left:21px}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:7px;overflow:hidden}
.seg button{font:600 .8rem var(--f-body);background:none;border:0;color:var(--accent);padding:5px 7px;cursor:pointer}
.seg button+button{border-left:1px solid var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.seg.idle{opacity:.5}
.seg button:disabled{cursor:not-allowed}
.sim .simctl{display:grid;grid-template-columns:minmax(0,1fr) 3em;gap:10px;align-items:center;min-height:32px}
.spanel{border:1px solid var(--line);border-radius:10px;padding:0 10px}
.spanel .trow{padding:7px 0}
.spanel .tlab{padding-top:7px}
.stxt{font-size:.92rem;line-height:1.35}.stxt b{font:700 1.1rem var(--f-disp)}
.sexp{justify-self:stretch;width:100%}
.sim input[type=range]{width:100%;accent-color:var(--accent)}
.simv{font-size:1.05rem;text-align:right}
.sblk{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sh2{font:700 1rem var(--f-disp);letter-spacing:.02em}
.ssum{display:grid;gap:4px}
.ssum .num{font-size:1.15rem}
.slist{display:grid}
.swl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.srow{display:grid;grid-template-columns:4em minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sd{font-size:.74rem;color:var(--muted);line-height:1.25}
.so{font-size:.9rem;font-weight:600;min-width:0}
.srow .res{font-size:.95rem;min-width:2.8em}
.tl-short{display:none}
.tbadge{display:inline-block;min-width:1.25em;margin-left:4px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--bg);font-size:.72rem;line-height:1.35;vertical-align:2px}
.tbadge:empty{display:none}
.fc.pickable{cursor:pointer;position:relative;transition:transform .12s ease}
.fc.pickable:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.fc.pickable:active{transform:scale(.97)}
.fc.pickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fc.sel{background:var(--ink);box-shadow:0 3px 10px color-mix(in srgb,var(--ink) 30%,transparent);transform:translateY(-2px)}
.fc.sel .fk,.fc.sel .fb,.fc.sel .fi .fb{color:var(--bg)}
.fc.sel .fp,.fc.sel .fkl{color:color-mix(in srgb,var(--bg) 72%,var(--ink))}
.fc.sel .fi,.fc.sel .fv{border-top-color:color-mix(in srgb,var(--bg) 25%,var(--ink))}
.fc.sel .fval.pos{color:color-mix(in srgb,var(--win) 70%,var(--bg))}
.fc.sel .fval.neg{color:color-mix(in srgb,var(--bg) 60%,var(--ink));opacity:1}
.selmark{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--bg);font:700 10px/16px var(--f-body);text-align:center}
.fcard.picked{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.onslip{display:inline-block;background:var(--ink);color:var(--bg);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.slipbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 14px;box-shadow:0 6px 20px color-mix(in srgb,var(--ink) 35%,transparent)}
.slipbar .sbn{display:flex;align-items:center;gap:8px;font-size:.9rem}
.slipbar .sbn b{font-family:var(--f-disp);font-size:1.05rem}
.slipbar .sbc{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--bg);font:700 1rem var(--f-disp)}
.slipbar .sbm{font-size:.8rem;color:color-mix(in srgb,var(--loss) 60%,var(--bg));flex-basis:100%;order:3}
.slipbar .btn.solid{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.kcols{display:grid;gap:14px}
@media (min-width:880px){.kcols{grid-template-columns:minmax(0,400px) minmax(0,1fr);align-items:start}}
.kpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;min-width:0}
.kpanel.busy{opacity:.55}

const sgnPct0=x=>(x>=0?'+':'−')+Math.abs(Math.round(x*100))+'%';

/* ---------- modell ---------- */
function rowsFor(lg){
  const L=DATA[lg], cur=(live[lg]||L.cur).map(r=>r.slice()), man=manual[lg]||{};  // a kézi eredmény csak ott számít, ahol a forrásban még nincs
  for(const r of cur){ if(r.length<5){const m=man[r[0]+'|'+r[1]+'|'+r[2]]; if(m){r.push(m[0],m[1]);r.man=true}} }
  return {prev:L.prev, cur};
}
function compute(lg){
  const L=DATA[lg], {prev,cur}=rowsFor(lg), n=L.teams.length;
  const played=cur.filter(r=>r.length>=5), all=prev.concat(played);
  let gh=0,ga=0;for(const r of all){gh+=r[3];ga+=r[4]}
  const muH=gh/all.length, muA=ga/all.length;
  const A=new Array(n).fill(null), D=new Array(n).fill(null), games=[];
  const step=(r,rec)=>{
    const [dt,h,a,g1,g2]=r;
    const l1=muH*Math.exp((A[h]-D[a])/S), l2=muA*Math.exp((A[a]-D[h])/S), o=outcome(l1,l2);
    games.push({dt,h,a,g1,g2,prev:!rec,hA:A[h],hD:D[h],aA:A[a],aD:D[a],xh:o.xh,xa:o.xa});
    if(rec){
      const sh=(A[h]+D[h])/2, sa=(A[a]+D[a])/2;
      rec[h].push({dt,opp:a,home:true,gf:g1,ga:g2,xf:l1,xa:l2,p:o,xp:o.xh,pts:g1>g2?3:g1===g2?1:0,oppS:sa,man:!!r.man});
      rec[a].push({dt,opp:h,home:false,gf:g2,ga:g1,xf:l2,xa:l1,p:{w:o.l,d:o.d,l:o.w},xp:o.xa,pts:g2>g1?3:g1===g2?1:0,oppS:sh,man:!!r.man});
    }
    const e1=g1-l1,e2=g2-l2;
    A[h]+=K*e1; D[a]-=K*e1; A[a]+=K*e2; D[h]-=K*e2;
    if(rec){const lh=rec[h].at(-1),la=rec[a].at(-1);lh.A=A[h];lh.D=D[h];la.A=A[a];la.D=D[a]}
  };
  for(const r of prev){for(const t of [r[1],r[2]]) if(A[t]===null){A[t]=1000;D[t]=1000} step(r,null)}
  const prevTeams=[];for(let t=0;t<n;t++) if(A[t]!==null){A[t]=1000+CARRY*(A[t]-1000);D[t]=1000+CARRY*(D[t]-1000);prevTeams.push(t)}
  const curTeams=[...new Set(cur.flatMap(r=>[r[1],r[2]]))];
  const weakest=prevTeams.slice().sort((x,y)=>(A[x]+D[x])-(A[y]+D[y])).slice(0,3);
  const wA=weakest.reduce((s,t)=>s+A[t],0)/3||1000, wD=weakest.reduce((s,t)=>s+D[t],0)/3||1000;
  const promoted=[];
  for(const t of curTeams) if(A[t]===null){A[t]=wA;D[t]=wD;promoted.push(t)}
  const start={};for(const t of curTeams)start[t]={A:A[t],D:D[t]};
  const rec={};for(const t of curTeams)rec[t]=[];
  for(const r of played) step(r,rec);
  // tabella
  const tab={};for(const t of curTeams)tab[t]={t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  for(const r of played){const [,h,a,g1,g2]=r,H=tab[h],Aw=tab[a];H.p++;Aw.p++;H.gf+=g1;H.ga+=g2;Aw.gf+=g2;Aw.ga+=g1;
    if(g1>g2){H.w++;Aw.l++;H.pts+=3}else if(g1<g2){Aw.w++;H.l++;Aw.pts+=3}else{H.d++;Aw.d++;H.pts++;Aw.pts++}}
  const table=Object.values(tab).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
  table.forEach((r,i)=>r.pos=i+1);
  const teams=curTeams.map(t=>{
    const h=rec[t], last=h.slice(-5), base=h.length>5?h[h.length-6]:start[t];
    const form=last.reduce((s,m)=>s+(m.pts-m.xp),0);
    const dS=((A[t]+D[t])/2)-((base.A+base.D)/2);
    return {t,name:L.teams[t],A:A[t],D:D[t],S:(A[t]+D[t])/2,form,dS,hist:h,start:start[t],pos:tab[t].pos,tab:tab[t],promoted:promoted.includes(t),
      xPts:h.reduce((s,m)=>s+m.xp,0)};
  }).sort((x,y)=>y.S-x.S);
  teams.forEach((x,i)=>x.rank=i+1);
  const byT={};teams.forEach(x=>byT[x.t]=x);
  const lastDate=played.length?played.at(-1)[0]:null;
  const remaining=cur.filter(r=>r.length<5);
  return {lg,L,A,D,muH,muA,teams,byT,table,played,remaining,lastDate,n:curTeams.length,promoted,games};
}
function predict(M,h,a){const l1=M.muH*Math.exp((M.A[h]-M.D[a])/S), l2=M.muA*Math.exp((M.A[a]-M.D[h])/S);return {l1,l2,...outcome(l1,l2)}}

/* Vonaldiagram: series = [{vals:[rajt, 1. meccs után, ...], color, dash}] */
function lineChart(series,label){
  const len=Math.max(...series.map(s=>s.vals.length));
  if(len<2) return '<p class="muted small">Még nincs lejátszott meccs.</p>';
  const W=640,H=300,pl=54,pr=14,pt=16,pb=34,FS=17;
  const vals=series.flatMap(s=>s.vals).concat([1000]);
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=Math.max(10,(hi-lo)*.12);lo-=pad;hi+=pad;
  const step=(hi-lo)>160?50:(hi-lo)>80?25:10;
  const x=i=>pl+(W-pl-pr)*i/(len-1), y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g='';for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){if(v===1000)continue;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+5}" text-anchor="end" font-size="${FS}" fill="var(--muted)">${v}</text>`}
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(1000)}" y2="${y(1000)}" stroke="var(--ink)" stroke-width="2.2" stroke-dasharray="10 6" opacity=".75"/><text x="${pl-8}" y="${y(1000)+5}" text-anchor="end" font-size="${FS}" font-weight="700" fill="var(--ink)">1000</text>`;
  const lines=series.map(s=>{const d=s.vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    const last=s.vals.length-1;
    return `<path d="${d}" fill="none" stroke="var(--${s.color})" stroke-width="3" stroke-linejoin="round"${s.dash?' stroke-dasharray="9 6"':''}/>`+
      s.vals.map((v,i)=>i?`<circle cx="${x(i)}" cy="${y(v)}" r="${i===last?5.5:3}" fill="${s.dash&&i===last?'var(--surface)':'var(--'+s.color+')'}" stroke="var(--${s.color})" stroke-width="${s.dash&&i===last?2.5:0}"/>`:'').join('')}).join('');
  const n=len-1, ev=Math.ceil(n/8);
  let xl='';for(let i=1;i<=n;i++) if(i%ev===0||i===n) xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="${FS}" fill="var(--muted)">${i}.</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${lines}
    <text x="${pl}" y="${H-8}" font-size="${FS}" fill="var(--muted)">rajt</text>${xl}</svg>`;
}
const teamSeries=t=>{const pts=[t.start].concat(t.hist);return {A:pts.map(p=>p.A),D:pts.map(p=>p.D),S:pts.map(p=>(p.A+p.D)/2)}};

function similarHtml(H,Aw){

  // csapat nézőpontjából: a csapat meccsei a cél-csapathoz hasonló ellenfelek ellen
  const teamList=(team,target,side)=>G.filter(g=>((g.h===team.t&&g.a!==target.t&&sim(g.aA,g.aD,target))&&(!simVenue||side==='h'))||((g.a===team.t&&g.h!==target.t&&sim(g.hA,g.hD,target))&&(!simVenue||side==='a')))
    .map(g=>{const home=g.h===team.t;return {g,home,opp:home?g.a:g.h,gf:home?g.g1:g.g2,ga:home?g.g2:g.g1,oS:home?(g.aA+g.aD)/2:(g.hA+g.hD)/2,xp:home?g.xh:g.xa}})
    .sort((x,y)=>y.g.dt.localeCompare(x.g.dt));
  const leagueList=G.filter(g=>sim(g.hA,g.hD,H)&&sim(g.aA,g.aD,Aw)).sort((x,y)=>y.dt.localeCompare(x.dt));
  const L1=teamList(H,Aw,'h'), L2=teamList(Aw,H,'a');

    <div class="flist">${html||`<p class="muted">${valueOnly||confOnly?'Nincs a feltételeknek megfelelő tipp. Próbálj kisebb küszöböt, szélesebb szorzósávot vagy hosszabb időszakot.':'Ebben az időszakban nincs meccs. Válassz hosszabb időszakot.'}</p>`}</div>

function runSim(){
  const R=M.remaining, N=4000, ids=M.teams.map(t=>t.t), nRel=RELEG[M.lg];
  const randn=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const SD=25+50*R.length/Math.max(1,R.length+M.played.length); // az erősségek bizonytalansága (idény elején nagyobb): minden szimulációban kicsit más erőkkel számol
  const res={};ids.forEach(t=>res[t]={title:0,top4:0,rel:0,pts:0,pos:new Array(ids.length).fill(0)});
  for(let s=0;s<N;s++){
    const tb={};ids.forEach(t=>{const x=M.byT[t].tab;tb[t]={t,pts:x.pts,gd:x.gf-x.ga,gf:x.gf}});
    const nA={},nD={};ids.forEach(t=>{nA[t]=M.A[t]+SD*randn();nD[t]=M.D[t]+SD*randn()});
    for(const r of R){const h=r[1],a=r[2],l1=M.muH*Math.exp((nA[h]-nD[a])/S),l2=M.muA*Math.exp((nA[a]-nD[h])/S);const g1=samplePois(l1),g2=samplePois(l2);
      tb[h].gd+=g1-g2;tb[a].gd+=g2-g1;tb[h].gf+=g1;tb[a].gf+=g2;
      if(g1>g2)tb[h].pts+=3;else if(g1<g2)tb[a].pts+=3;else{tb[h].pts++;tb[a].pts++}}
    const o=Object.values(tb).sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||Math.random()-.5);
    o.forEach((x,i)=>{const r=res[x.t];r.pts+=x.pts;r.pos[i]++;if(i===0)r.title++;if(i<4)r.top4++;if(i>=o.length-nRel)r.rel++})
  }
  for(const t in res){const r=res[t];r.pts/=N;r.title/=N;r.top4/=N;r.rel/=N}
  return res;
}

function kOptimize(p,bk,allow,uniform){
  const n=p.length,N=1<<n,po=new Float64Array(N);
  for(let o=0;o<N;o++){let pr=1;for(let i=0;i<n;i++)pr*=(o>>i)&1?p[i]:1-p[i];po[o]=pr;}
  const bets=[];
  for(let b=1;b<N;b++){
    if(!allow(b))continue;
    let odd=1,k=0;for(let i=0;i<n;i++)if((b>>i)&1){odd*=bk[i];k++;}
    const wins=[];for(let o=0;o<N;o++)if((o&b)===b)wins.push(o);
    bets.push({mask:b,odd,wins,k});
  }
  const M=bets.length,grp=new Int32Array(M);let P=0;
  if(uniform){const idx={};bets.forEach((b,j)=>{if(!(b.k in idx))idx[b.k]=P++;grp[j]=idx[b.k];});}
  else{bets.forEach((b,j)=>{grp[j]=j;});P=M;}
  const x=new Float64Array(P).fill(0.001),G=new Float64Array(P),m1=new Float64Array(P),m2=new Float64Array(P),w=new Float64Array(N);
  const IT=4000;
  for(let it=0;it<IT&&M;it++){
    let S=0;for(let j=0;j<M;j++)S+=x[grp[j]];
    w.fill(1-S);
    for(let j=0;j<M;j++){const v=x[grp[j]]*bets[j].odd;if(v)for(const o of bets[j].wins)w[o]+=v;}
    let base=0;for(let o=0;o<N;o++)base+=po[o]/w[o];
    G.fill(0);
    for(let j=0;j<M;j++){let s=0;for(const o of bets[j].wins)s+=po[o]/w[o];G[grp[j]]+=s*bets[j].odd-base;}
    const a=0.001*Math.min(1,(IT-it)/1500+0.02);
    for(let q=0;q<P;q++){
      m1[q]=0.9*m1[q]+0.1*G[q];m2[q]=0.999*m2[q]+0.001*G[q]*G[q];
      const mh=m1[q]/(1-Math.pow(0.9,it+1)),vh=m2[q]/(1-Math.pow(0.999,it+1));
      x[q]=Math.max(0,x[q]+a*mh/(Math.sqrt(vh)+1e-9));
    }
    S=0;for(let j=0;j<M;j++)S+=x[grp[j]];
    if(S>0.97)for(let q=0;q<P;q++)x[q]*=0.97/S;
  }
  return bets.map((b,j)=>({mask:b.mask,odd:b.odd,f:x[grp[j]]}));
}

function kCompute(){
  const out=$('#kout');if(!out)return;out.classList.remove('busy');
  const bank=knum(kst.bank),pct=knum(kst.pct)/100,manual=kst.mode==='manual';
  const valid=[],notes=[];let off=0,noEdge=0,negIn=0;
  picks.forEach((x,i)=>{
    const o=knum(ownOf(x)),b=knum(bkOf(x)),el=$('#kedge'+i);
    if(!(o>1)||!(b>1)){if(el){el.textContent='–';el.className='kedge'}if(x.on)noEdge++;return}
    const e=b/o-1;if(el){el.textContent=(e>0?'+':'')+(e*100).toFixed(1).replace('.',',')+'%';el.className='kedge '+(e>0?'pos':'neg')}
    if(!x.on){off++;return}
    if(e>0||manual){valid.push({id:i+1,p:1/o,b,e});if(e<=0)negIn++}else noEdge++;
  });
  const head=`<div class="khead">${manual?'Saját tétek eredménye':'Javasolt felosztás'}</div>`;
  const fail=msg=>{out.innerHTML=head+`<p class="small muted">${msg}</p>`;if(manual){const m=$('#kmanual');if(m)m.innerHTML='<p class="small muted">A tétek beállításához előbb adj meg érvényes tippeket.</p>';kManualSig=''}};
  if(!(bank>0)||!(pct>0))return fail('Adj meg pozitív keretet és tétszázalékot.');
  if(!valid.length)return fail(manual?'Nincs bepipált tipp érvényes szorzókkal.':'Nincs olyan bepipált tipp, amelyen előnyöd lenne: a modell szorzójának kisebbnek kell lennie az irodainál.');
  const n=valid.length;
  if(![...Array(n)].some((_,i)=>!kst.offk.includes(i+1)))return fail('Egyetlen kötéstípus sincs bejelölve. Jelölj be legalább egyet.');
  const keyOf=m=>valid.filter((v,j)=>(m>>j)&1).map(v=>v.id).join('+');
  const popc=m=>{let c=0;while(m){c+=m&1;m>>=1}return c};
  const allow=m=>!kst.offk.includes(popc(m));
  const probOf=m=>valid.reduce((s,v,j)=>(m>>j)&1?s*v.p:s,1);
  const oddOf=m=>valid.reduce((s,v,j)=>(m>>j)&1?s*v.b:s,1);
  let placed,skipped=0,K=0;
  if(manual){
    const cnt={};for(let m=1;m<(1<<n);m++)if(allow(m)){const k=popc(m);cnt[k]=(cnt[k]||0)+1}
    const ksM=Object.keys(cnt).map(Number).sort((a,b)=>a-b);
    if(!ksM.length)return fail('Nincs bejelölt kötéstípus.');
    kRenderManual(ksM,cnt,bank*pct);
    placed=[];
    for(let m=1;m<(1<<n);m++){if(!allow(m))continue;const k=popc(m),st=Math.max(0,Math.round(knum(kst.per[k])||0));if(st>0)placed.push({mask:m,k,key:keyOf(m),odd:oddOf(m),prob:probOf(m),stake:st})}
    if(!placed.length)return fail('Minden kötéstípusnál 0 Ft a tét. Adj meg téteket vagy mozdítsd meg a csúszkát.');
  }else{
    const bets=kOptimize(valid.map(v=>v.p),valid.map(v=>v.b),allow,kst.uniform!==false);
    K=bets.reduce((s,b)=>s+b.f,0);
    if(!(K>1e-6))return fail('A meghagyott kötésekre a Kelly nem javasol tétet. Jelölj be kisebb kötéstípusokat is.');
    const used=Math.min(pct,K),scale=bank*used/K;
    placed=bets.map(b=>({...b,k:popc(b.mask),key:keyOf(b.mask),prob:probOf(b.mask),stake:Math.round(b.f*scale/10)*10})).filter(b=>b.stake>0);
    skipped=bets.filter(b=>b.f>1e-5).length-placed.length;
  }
  const total=placed.reduce((s,b)=>s+b.stake,0);
  const ev=placed.reduce((s,b)=>s+b.stake*(b.prob*b.odd-1),0);
  const N=1<<n,byMiss=Array.from({length:n+1},()=>({p:0,min:Infinity,max:-Infinity}));
  let pWin=0;
  for(let o=0;o<N;o++){
    let pr=1;for(let i=0;i<n;i++)pr*=(o>>i)&1?valid[i].p:1-valid[i].p;
    let ret=0;for(const b of placed)if((o&b.mask)===b.mask)ret+=b.stake*b.odd;
    const net=ret-total,m=n-popc(o),g=byMiss[m];
    g.p+=pr;g.min=Math.min(g.min,net);g.max=Math.max(g.max,net);
    if(net>0)pWin+=pr;
  }
  const allWin=byMiss[0].max;
  const cls=x=>Math.round(x)>0?'pv':Math.round(x)<0?'nv':'';
  const rangeCell=g=>{const a=Math.round(g.min),b=Math.round(g.max);
    if(a===b)return `<span class="kres ${cls(a)}">${ksft(a)}</span>`;
    return `<span class="kres ${cls(a)}">${ksft(a)}</span> … <span class="kres ${cls(b)}">${ksft(b)}</span>`};
  const missRows=byMiss.map((g,m)=>`<tr><td class="lbl">${m===0?'Mind bejön':m===n?'Mind elmegy':m+' elmegy'}</td><td class="r">${kpct(g.p)}</td><td class="r">${rangeCell(g)}</td></tr>`).join('');
  if(off)notes.push(`<b>${off} tipp kivéve</b> a szelvényről.`);
  if(noEdge)notes.push(`<b>${noEdge} bepipált tipp kimaradt</b>, mert nincs rajta előnyöd vagy hiányzik a szorzó.`);
  if(manual&&negIn)notes.push(`<b>${negIn} tippen nincs előnyöd</b>, mégis szerepel a kötésekben. Ezek rontják a várható profitot.`);
  if(manual&&Math.abs(total-bank*pct)>=10)notes.push(`Az összes tét a keret <b>${kpct(total/bank)}-a</b>, a beállított ${kpct(pct)} helyett. A csúszka mozgatása visszaállítja.`);
  if(!manual&&K<pct)notes.push(`A teljes Kelly csak a keret <b>${kpct(K)}-át</b> tenné fel, ezért ennél többet nem javaslok, pedig ${kpct(pct)}-ot adtál meg.`);
  if(valid.some(v=>v.e>0.15))notes.push(`<b>15% feletti előny</b> a gyakorlatban ritka. Ha a modell túl optimista, a felosztás veszteséges lehet.`);
  if(skipped>0)notes.push(`${skipped} kötés 10 Ft alatti tétet kapna, ezek kimaradtak.`);
  const groups={};placed.forEach(b=>{(groups[b.k]=groups[b.k]||[]).push(b)});
  const ks=Object.keys(groups).map(Number).sort((a,b)=>a-b);
  const chips=key=>key.split('+').map(x=>`<span class="kchip">${x}</span>`).join('');
  const bars=ks.map(k=>{const s=groups[k].reduce((a,b)=>a+b.stake,0);return `<div class="kbar"><span>${kshort(k)}</span><span class="track"><span class="fill" style="width:${(s/total*100).toFixed(1)}%"></span></span><span class="amt">${kft(s)}</span></div>`}).join('');
  const table=ks.map(k=>{
    const live=groups[k].sort((a,b)=>b.stake-a.stake).map(b=>`<tr><td>${chips(b.key)}</td><td class="r">${dec(b.odd)}</td><td class="r">${kft(b.stake)}</td><td class="r">${kft(b.stake*b.odd)}</td></tr>`).join('');
    return `<tr class="grp"><td colspan="4">${kname(k)} · ${groups[k].length} db</td></tr>`+live}).join('');
  out.innerHTML=`${head}
    <div class="kbig"><div><span class="l">Összes tét</span><span class="v">${kft(total)}</span></div><div><span class="l">Szelvények</span><span class="v">${placed.length} db</span></div></div>
    <div class="kstats">
      <div class="kstat"><div class="l">Várható profit (modell szerint)</div><div class="v ${cls(ev)}">${ksft(ev)}</div></div>
      <div class="kstat"><div class="l">Nyereség esélye</div><div class="v">${kpct(pWin)}</div></div>
      <div class="kstat"><div class="l">Ha minden bejön</div><div class="v pv">${ksft(allWin)}</div></div>
    </div>
    <div class="khead">Ha elmegy egy-két tipp</div>
    <div class="tblwrap"><table class="ktable"><thead><tr><th class="l">Eredmény</th><th class="r">Esély</th><th class="r">Nettó (tól … ig)</th></tr></thead><tbody>${missRows}</tbody></table></div>
    <p class="small muted">A „tól … ig” attól függ, melyik tipp megy el: a nagyobb szorzójú elvesztése többe kerül.</p>
    <div class="kbars">${bars}</div>
    ${notes.map(x=>`<p class="note">${x}</p>`).join('')}
    <div class="khead">Szelvények</div>
    <div class="tblwrap"><table class="ktable"><thead><tr><th class="l">Tippek</th><th class="r">Szorzó</th><th class="r">Tét</th><th class="r">Kifizetés</th></tr></thead><tbody>${table}</tbody></table></div>
    <p class="small muted">${manual?'A tétek a „Saját tétek” beállításból jönnek.':`A felosztás a teljes Kelly arányait követi a megadott tétszázalékra skálázva, 10 Ft-ra kerekítve. Teljes Kelly szerint a keret ${kpct(K)}-a menne fel.`} A számok a tippek sorszámára utalnak.</p>`;
}
function kTiltText(t){const q=Math.pow(4,t/100),f=x=>x.toLocaleString('hu-HU',{maximumFractionDigits:2});
  if(Math.abs(t)<1)return 'Minden szelvény egyforma tétet kap.';
  return t>0?`Minden eggyel nagyobb kötés szelvényenként ${f(q)}× akkora tétet kap.`:`Minden eggyel kisebb kötés szelvényenként ${f(1/q)}× akkora tétet kap.`}
function kApplyTilt(){if(!kLastM)return;const {ks,cnt,budget}=kLastM;
  const q=Math.pow(4,(+kst.tilt||0)/100),w=k=>Math.pow(q,k-ks[0]);
  const unit=budget/ks.reduce((s,k)=>s+cnt[k]*w(k),0);
  ks.forEach(k=>{kst.per[k]=Math.max(10,Math.round(unit*w(k)/10)*10);const el=$('#kper'+k);if(el)el.value=kst.per[k]})}
function kRenderManual(ks,cnt,budget){
  kLastM={ks,cnt,budget};
  const sig=ks.map(k=>k+':'+cnt[k]).join(',')+'|'+Math.round(budget);
  if(sig!==kst.msig){kst.msig=sig;kApplyTilt();saveK()}
  const box=$('#kmanual');if(!box)return;
  if(sig!==kManualSig){kManualSig=sig;
    box.innerHTML=`<div class="ktilt"><label class="small muted" for="ktilt">Tétsúlyozás</label>
        <input type="range" id="ktilt" min="-100" max="100" step="5" value="${+kst.tilt||0}">
        <div class="ends"><span>Kis kötésekre több</span><span>Egyforma</span><span>Nagyokra több</span></div>
        <div class="small" id="ktiltread">${kTiltText(+kst.tilt||0)}</div></div>
      <div class="kfrow head"><span>Kötés</span><span>Ft / szelvény</span><span>Összesen</span></div>
      ${ks.map(k=>`<div class="kfrow"><label for="kper${k}">${kname(k)} · ${cnt[k]} db</label><input id="kper${k}" class="kper" data-k="${k}" type="number" inputmode="numeric" min="0" step="10" value="${kst.per[k]??0}"><span class="sum" id="ksum${k}"></span></div>`).join('')}
      <div class="kfrow tot"><span>Összes tét</span><span></span><span class="sum" id="ksumall"></span></div>`}
  kUpdateSums();
}
function kUpdateSums(){if(!kLastM)return;let t=0;
  kLastM.ks.forEach(k=>{const s=(Math.max(0,knum(kst.per[k])||0))*kLastM.cnt[k];t+=s;const el=$('#ksum'+k);if(el)el.textContent=kft(s)});
  const a=$('#ksumall');if(a)a.textContent=kft(t)}

function comboInput(e){
  const t=e.target;
  const row=t.closest('.kmrow');
  if(row){const x=picks[+row.dataset.i];if(!x)return false;
    if(t.classList.contains('kown')){x.own=t.value;kSchedule();return true}
    if(t.classList.contains('kbk')){x.bk=t.value;kSchedule();return true}}
  if(t.id==='kbank'){kst.bank=t.value;kManualSig='';kSchedule();return true}
  if(t.id==='kpct'){kst.pct=t.value;kManualSig='';kSchedule();return true}
  if(t.id==='ktilt'){kst.tilt=+t.value;const r=$('#ktiltread');if(r)r.textContent=kTiltText(kst.tilt);kApplyTilt();kUpdateSums();kSchedule();return true}
  if(t.classList.contains('kper')){kst.per[t.dataset.k]=t.value;kUpdateSums();kSchedule();return true}
  return false;
}
function comboChange(e){
  const t=e.target;
  if(t.classList.contains('kon')){const row=t.closest('.kmrow'),x=picks[+row.dataset.i];x.on=t.checked;row.classList.toggle('offm',!t.checked);kSchedule();return true}
  if(t.dataset.fk){const k=+t.dataset.fk;kst.offk=kst.offk.filter(v=>v!==k);if(!t.checked)kst.offk.push(k);kManualSig='';kSchedule();return true}
  if(t.id==='kuniform'){kst.uniform=t.checked;kSchedule();return true}
  return false;
}
function comboClick(e){
  const del=e.target.closest('.kdel');
  if(del){const i=+del.closest('.kmrow').dataset.i;picks.splice(i,1);savePicks();render();return true}
  if(e.target.closest('#kclear')){picks=[];savePicks();render();return true}
  const md=e.target.closest('[data-kmode]');
  if(md){kst.mode=md.dataset.kmode;saveK();kManualSig='';
    document.querySelectorAll('[data-kmode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kmode===kst.mode));
    $('#kmanual').hidden=kst.mode!=='manual';$('#kunibox').hidden=kst.mode==='manual';kCompute();return true}
  return false;
}

function render(){
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.lg===state.league));
  document.querySelectorAll('.tab').forEach(c=>c.setAttribute('aria-selected',c.dataset.v===state.view));
  renderStamp();
  const v={rank:vRank,team:vTeam,match:vMatch,tips:vTips,season:vSeason,combo:vCombo}[state.view]();
  $('#view').innerHTML=v+slipBar();
  const tb=$('#tbadge');if(tb)tb.textContent=picks.length?picks.length:'';
  if(state.view==='combo') comboMount();
  if(state.view==='season'&&!sims[M.lg]) setTimeout(()=>{sims[M.lg]=runSim();if(state.view==='season')render()},30);
}
$('#leagues').innerHTML=LEAGUES.map(l=>`<button class="chip" data-lg="${l}">${DATA[l].name}</button>`).join('');
$('#leagues').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;state.league=b.dataset.lg;state.team=state.home=state.away=null;store.set('lg',state.league);M=getM(state.league);render()});
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;state.view=b.dataset.v;store.set('view',state.view);render();window.scrollTo({top:0})});
$('#view').addEventListener('click',e=>{
  const pc_=e.target.closest('[data-pick]');
  if(pc_){togglePick(pc_);const y=window.scrollY;render();window.scrollTo(0,y);return}
  const gt=e.target.closest('[data-goto]');
  if(gt){state.view=gt.dataset.goto;store.set('view',state.view);render();window.scrollTo({top:0});return}
  if(state.view==='combo'&&comboClick(e))return;
  const pr=e.target.closest('[data-pair]');
  if(pr){const [h,a]=pr.dataset.pair.split('_').map(Number);if(pr.dataset.lg&&pr.dataset.lg!==state.league){state.league=pr.dataset.lg;store.set('lg',state.league);M=getM(state.league)}
    state.home=h;state.away=a;state.view='match';store.set('view','match');render();const p=$('#predictor');if(p)p.scrollIntoView({block:'start'});else window.scrollTo({top:0});return}
  if(e.target.id==='tipsAll'){tipsAll=!tipsAll;store.set('tipsAll',tipsAll);tipsShow=40;render();return}
  if(e.target.id==='tipsMore'){tipsShow+=40;render();return}
  if(e.target.closest('#simVenue')){simVenue=!simVenue;store.set('simVenue',simVenue);render();return}
  if(e.target.closest('[data-simlevel]')){simLevel=simLevel?0:1;if(!simLevel)simOpen={};render();return}
  if(e.target.closest('#simPrev')){simPrev=!simPrev;store.set('simPrev',simPrev);render();return}
  const smd=e.target.closest('[data-simmode]');if(smd){simMode=smd.dataset.simmode;store.set('simMode',simMode);render();return}
  const so=e.target.closest('[data-simopen]');if(so){simOpen[so.dataset.simopen]=!simOpen[so.dataset.simopen];render();return}
  const tg=e.target.closest('[data-tg]');if(tg){const o=tg.dataset.tg==='team'?teamSer:matchSer,k=tg.dataset.k;o[k]=!o[k];store.set(tg.dataset.tg==='team'?'teamSer':'matchSer',o);render();return}
  const sb=e.target.closest('[data-sort]');if(sb){tipSort=sb.dataset.sort;store.set('tipSort',tipSort);tipsShow=40;render();return}
  if(e.target.closest('#confOnly')){confOnly=!confOnly;store.set('confOnly',confOnly);tipsShow=40;render();return}
  if(e.target.closest('#valueOnly')){valueOnly=!valueOnly;store.set('valueOnly',valueOnly);tipsShow=40;render();return}
  if(e.target.closest('#rangeFlag')){rangeFlag=!rangeFlag;store.set('rangeFlag',rangeFlag);render();return}
  if(e.target.closest('#blendOn')){blendOn=!blendOn;blendW=blendOn?blendVal:0;store.set('blendOn',blendOn);render();return}
  const bw=e.target.closest('[data-bw]');if(bw){blendVal=+bw.dataset.bw;blendW=blendOn?blendVal:0;store.set('blendVal',blendVal);render();return}
  const vm=e.target.closest('[data-vm]');if(vm){valueMode=vm.dataset.vm;tipSort='value';store.set('valueMode',valueMode);store.set('tipSort','value');render();return}
  if(e.target.closest('select,label'))return;
  const tr=e.target.closest('tr[data-t]');if(tr){state.team=+tr.dataset.t;state.view='team';render();window.scrollTo({top:0});return}
  const sv=e.target.closest('[data-save]');if(sv){const k=sv.dataset.save,g1=parseInt($('#g1-'+k).value),g2=parseInt($('#g2-'+k).value);
    if(isNaN(g1)||isNaN(g2)||g1<0||g2<0){sv.textContent='Adj meg 2 számot';return}
    const [d,h,a]=k.split('_');(manual[state.league]=manual[state.league]||{})[d+'|'+h+'|'+a]=[g1,g2];store.set('manual',manual);recompute();render();return}
  if(e.target.id==='clearMan'){delete manual[state.league];store.set('manual',manual);recompute();render()}
});
$('#view').addEventListener('keydown',e=>{const t=e.target.closest('[data-pair],[data-pick]');if((e.key==='Enter'||e.key===' ')&&t&&t===e.target){e.preventDefault();t.click()}});
$('#view').addEventListener('input',e=>{
  if(state.view==='combo'&&comboInput(e))return;
  if(e.target.id==='simTol'){const v=document.querySelector('.simv');if(v)v.textContent='±'+e.target.value}
});
$('#view').addEventListener('change',e=>{
  if(state.view==='combo'&&comboChange(e))return;
  if(e.target.id==='simTol'){simTol=+e.target.value;store.set('simTol',simTol);const y=window.scrollY;render();window.scrollTo(0,y);const el=$('#simTol');if(el)el.focus();return}
  if(e.target.id==='teamSel'){state.team=+e.target.value;render()}
  if(e.target.id==='hSel'){state.home=+e.target.value;render()}
  if(e.target.id==='aSel'){state.away=+e.target.value;render()}
  if(e.target.id==='oddsMin'){oddsMin=+e.target.value;store.set('oddsMin',oddsMin);render()}
  if(e.target.id==='oddsMax'){oddsMax=+e.target.value;store.set('oddsMax',oddsMax);render()}
  if(e.target.id==='tipDays'){tipDays=+e.target.value;store.set('tipDays',tipDays);tipsShow=40;render()}
  if(e.target.id==='valueMin'){valueMin=+e.target.value;store.set('valueMin',valueMin);render()}
});

/* Adatforrások az idei idényre, ebben a sorrendben:
   1. data/friss.json – a GitHub-automatizmus tölti le naponta a football-data.org-ról
   2. openfootball – ha az 1. nem érhető el
   3. a fájlba épített adatok – ha egyik sem (pl. claude.ai artifactként futtatva)
   A korábbi idény mindig a beépített (openfootball) adat. */
const SEASON='2026-27';
const SEASON_OF={'br.1':'2026'};           // naptári évben játszott ligák
const seasonOf=lg=>SEASON_OF[lg]||SEASON;
async function getJSON(url){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),6000);
  try{const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});if(!r.ok)return null;return await r.json()}catch(e){return null}finally{clearTimeout(t)}
}
function ingest(lg,matches,shortOf){   // matches: [dátum, hazai név, vendég név, (gól1, gól2)]
  return matches.map(m=>{const row=[m[0],teamIndex(lg,m[1],shortOf&&shortOf[m[1]]),teamIndex(lg,m[2],shortOf&&shortOf[m[2]])];if(m.length>=5)row.push(m[3],m[4]);return row})
    .sort((a,b)=>a[0].localeCompare(b[0]));
}
const playedN=rows=>rows.filter(x=>x.length>=5).length;
async function loadSources(){
  const [fdj,oj]=SNAP?[SNAP.friss,SNAP.odds]:await Promise.all([getJSON('data/friss.json'),getJSON('data/odds.json')]);
  if(oj&&oj.leagues) ODDS=oj;
  if(fdj&&fdj.leagues){
    fdUpdated=fdj.updated||null;
    for(const lg of LEAGUES){const x=fdj.leagues[lg];if(!x||!x.matches||!x.matches.length||(x.season&&x.season!==seasonOf(lg)))continue;
      const rows=ingest(lg,x.matches,x.short);if(playedN(rows)>=playedN(DATA[lg].cur)){live[lg]=rows;src[lg]=SNAP?'snap':'fd';invalidate(lg)}}
  }
  if(SNAP){M=getM(state.league);render();return}
  await Promise.all(LEAGUES.filter(lg=>!live[lg]).map(async lg=>{
    const j=await getJSON(`https://raw.githubusercontent.com/openfootball/football.json/master/${seasonOf(lg)}/${lg}.json`);
    if(!j||!j.matches)return;
    const ms=j.matches.map(m=>{const s=m.score,f=Array.isArray(s)?s:(s&&s.ft);return f&&f.length===2?[m.date,m.team1,m.team2,f[0],f[1]]:[m.date,m.team1,m.team2]});
    const rows=ingest(lg,ms,null);if(playedN(rows)>playedN(DATA[lg].cur)){live[lg]=rows;src[lg]='of';invalidate(lg)}
  }));
  M=getM(state.league);render();
}
M=getM(state.league);render();loadSources();
</script>
